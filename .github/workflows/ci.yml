name: Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU runtime and development tools
        run: |
          python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q --cov=src --cov-report=term-missing
      - name: Offline benchmark quickstart
        run: python examples/benchmark_demo.py --output "$RUNNER_TEMP/winding-benchmark-demo"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import glob, tomllib, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          with open("pyproject.toml", "rb") as config:
              modules = tomllib.load(config)["tool"]["setuptools"]["py-modules"]
          required = {f"{name}.py" for name in modules}
          missing = sorted(required - names)
          assert not missing, f"wheel missing {missing}"
          print("wheel contents OK")
          EOF
      - name: Exercise installed wheel and rebuilt sdist
        run: |
          python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          python -I -c "import field_solver, physical_grid, whole_reference"
          python -I examples/minimal_field.py
          python -m pip uninstall --yes winding-field-experiments
          python -m pip install dist/*.tar.gz
          python -I -c "import field_solver, physical_grid, whole_reference"
          python -I examples/minimal_field.py
