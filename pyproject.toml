[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "winding-field-experiments"
version = "1.3.0.dev1"
description = "Experimental winding-field construction over Herculaneum scroll surface predictions (research code, not a complete reconstruction)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license-files = ["LICENSE"]
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.1,<3",
  "tifffile>=2023.7",
]

[project.optional-dependencies]
# Runtime access to the public Vesuvius datasets.
data = ["zarr>=3,<4", "numcodecs>=0.13,<1"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
dev = ["ruff==0.17.0", "mypy==2.4.0", "build>=1.2,<2"]
all = [
  "zarr>=3,<4",
  "numcodecs>=0.13,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

# Research modules installed as flat py-modules; there is no distributable
# package namespace, and the frozen evidence directories are never packaged.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "anisotropic_reference",
  "block_solver",
  "coarse_reference",
  "coherence_pipeline",
  "constraint_templates",
  "common",
  "dataset_config",
  "evaluation_split",
  "field_constraints",
  "field_observations",
  "field_prefetch",
  "field_runtime",
  "field_solver",
  "field_sources",
  "field_store",
  "field_topology",
  "paris_data",
  "paris_pair_check",
  "paris_solve",
  "patch_check",
  "physical_grid",
  "sealed_predict",
  "whole_reference",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tools", "tests"]
addopts = "--import-mode=importlib"
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "node_modules", "run", "source-initial"]
testpaths = ["tests", "benchmarks/winding"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Generated run evidence is stored separately and never reformatted.
extend-exclude = [
  "results",
  "**/run",
  "**/source-initial",
  # Markdown keeps its authored code excerpts verbatim.
  "*.md",
]

[tool.ruff.lint]
# Focused on likely bugs and maintainability, not cosmetic churn.
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
ignore = [
  # Receipt/manifest strings and printed evidence lines are deliberately long.
  "E501",
  # Scripts and benchmarks must insert src/ into sys.path before importing it;
  # the import-after-code order is the bootstrap, not an accident.
  "E402",
  # Short numeric helpers read better as one-line lambdas in this codebase.
  "E731",
]

[tool.mypy]
# Incremental: annotated functions and a typed caller regression are checked;
# unannotated research-function bodies are not checked yet.
python_version = "3.11"
ignore_missing_imports = true
files = ["src", "tests/test_solver_interface.py"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
